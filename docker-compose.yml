services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradex_dev_password}
      POSTGRES_DB: tradex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradex"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tradex:${POSTGRES_PASSWORD:-tradex_dev_password}@db:5432/tradex
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tradex:${POSTGRES_PASSWORD:-tradex_dev_password}@db:5432/tradex
    command: python -m bot.bot
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
